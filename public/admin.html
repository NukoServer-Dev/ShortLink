<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理者パネル | 短縮URL</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #111827; color: #f9fafb; }
    body { max-width: 1100px; margin: 0 auto; padding: 24px; }
    input, button { font: inherit; padding: 9px 12px; border: 1px solid #4b5563; border-radius: 6px; }
    input { background: #1f2937; color: inherit; }
    button { cursor: pointer; background: #2563eb; color: white; margin: 3px; }
    button.danger { background: #b91c1c; }
    .row, .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .card { border: 1px solid #4b5563; border-radius: 8px; padding: 16px; margin: 12px 0; overflow-wrap: anywhere; }
    .muted { color: #9ca3af; }
    #login { max-width: 420px; }
    #login input { display: block; width: 100%; box-sizing: border-box; margin: 10px 0; }
    a { color: #93c5fd; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>管理者パネル</h1>
  <section id="login">
    <p>管理者アカウントでログインしてください。</p>
    <form id="loginForm">
      <input name="username" autocomplete="username" placeholder="ユーザー名" required>
      <input name="password" type="password" autocomplete="current-password" placeholder="パスワード" required>
      <button type="submit">ログイン</button>
    </form>
  </section>
  <section id="panel" hidden>
    <div class="toolbar">
      <form id="searchForm" class="row">
        <input id="query" placeholder="コード・URL・IP・理由で検索">
        <button>検索</button>
      </form>
      <button id="logout" type="button">ログアウト</button>
    </div>
    <p id="status" class="muted" aria-live="polite"></p>
    <div id="links"></div>
    <div class="toolbar">
      <button id="previous" type="button">前へ</button>
      <span id="pageLabel"></span>
      <button id="next" type="button">次へ</button>
    </div>
  </section>
  <script>
    let currentPage = 1;
    let currentQuery = "";
    const login = document.getElementById("login");
    const panel = document.getElementById("panel");
    const status = document.getElementById("status");

    async function request(path, options = {}) {
      const response = await fetch(path, {
        credentials: "same-origin",
        ...options,
        headers: { "Content-Type": "application/json", ...(options.headers || {}) }
      });
      if (response.status === 204) return null;
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || "リクエストに失敗しました");
      return data;
    }

    function showPanel(visible) {
      login.hidden = visible;
      panel.hidden = !visible;
    }

    async function loadLinks() {
      status.textContent = "読み込み中...";
      try {
        const params = new URLSearchParams({ page: String(currentPage), q: currentQuery });
        const data = await request(`/api/admin/links?${params}`);
        const container = document.getElementById("links");
        container.replaceChildren();
        for (const item of data.items) container.appendChild(renderLink(item));
        const pages = Math.max(1, data.pages);
        document.getElementById("pageLabel").textContent = `${data.page} / ${pages} ページ（全 ${data.total} 件）`;
        document.getElementById("previous").disabled = data.page <= 1;
        document.getElementById("next").disabled = data.page >= pages;
        status.textContent = data.items.length ? "" : "該当するURLはありません。";
      } catch (error) {
        status.textContent = error.message;
        if (error.message === "ログインしてください") showPanel(false);
      }
    }

    function renderLink(item) {
      const card = document.createElement("article");
      card.className = "card";
      const heading = document.createElement("h2");
      heading.textContent = item.code;
      const target = document.createElement("p");
      const link = document.createElement("a");
      link.textContent = item.url;
      link.href = item.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      target.append(link);
      const details = document.createElement("p");
      details.className = "muted";
      details.textContent = `作成: ${new Date(item.createdAt).toLocaleString()} / IP: ${item.creatorIp}`;
      card.append(heading, target, details);
      if (item.banned) addNote(card, "Ban", item.banReason);
      if (item.warned) addNote(card, "警告", item.warnReason);

      const actions = document.createElement("div");
      actions.className = "row";
      const ban = makeAction(item.banned ? "Ban理由を更新" : "Ban", "danger", async () => {
        const reason = prompt("Banの理由を入力してください（500文字以内）", item.banReason || "");
        if (reason === null) return;
        await request(`/api/admin/links/${encodeURIComponent(item.code)}/ban`, { method: "POST", body: JSON.stringify({ reason }) });
        await loadLinks();
      });
      const warn = makeAction(item.warned ? "警告理由を更新" : "警告", "", async () => {
        const reason = prompt("警告の理由を入力してください（500文字以内）", item.warnReason || "");
        if (reason === null) return;
        await request(`/api/admin/links/${encodeURIComponent(item.code)}/warn`, { method: "POST", body: JSON.stringify({ reason }) });
        await loadLinks();
      });
      const remove = makeAction("削除", "danger", async () => {
        if (!confirm(`${item.code} を完全に削除しますか？`)) return;
        await request(`/api/admin/links/${encodeURIComponent(item.code)}`, { method: "DELETE" });
        await loadLinks();
      });
      actions.append(ban, warn, remove);
      card.append(actions);
      return card;
    }

    function addNote(card, label, reason) {
      const note = document.createElement("p");
      note.textContent = `${label}: ${reason}`;
      card.append(note);
    }

    function makeAction(label, style, action) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = label;
      if (style) button.className = style;
      button.addEventListener("click", async () => {
        try { await action(); } catch (error) { status.textContent = error.message; }
      });
      return button;
    }

    document.getElementById("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = new FormData(event.currentTarget);
      try {
        await request("/api/admin/login", {
          method: "POST",
          body: JSON.stringify({ username: form.get("username"), password: form.get("password") })
        });
        showPanel(true);
        currentPage = 1;
        await loadLinks();
      } catch (error) { status.textContent = error.message; }
    });

    document.getElementById("searchForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      currentQuery = document.getElementById("query").value.trim();
      currentPage = 1;
      await loadLinks();
    });
    document.getElementById("previous").addEventListener("click", async () => { currentPage--; await loadLinks(); });
    document.getElementById("next").addEventListener("click", async () => { currentPage++; await loadLinks(); });
    document.getElementById("logout").addEventListener("click", async () => {
      await request("/api/admin/logout", { method: "POST" });
      showPanel(false);
      status.textContent = "ログアウトしました。";
    });
  </script>
</body>
</html>
